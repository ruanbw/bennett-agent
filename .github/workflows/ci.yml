name: CI

on:
  # 分支名必须与**实际默认分支**一致：这个仓库只有 `master`（`git ls-remote origin`
  # 只返回 refs/heads/master）。此前写的是 `main`，于是直接推到 master 的提交
  # 一次都不会触发任何检查——那套 1314 个后端用例 + 1138 个前端用例，从没在 CI 里
  # 跑过。改成两个分支都监听，以后改默认分支也不用再想这件事。
  push:
    branches: [master, main]
  pull_request:

# 只读权限：CI 不需要写仓库内容，显式收窄默认的 GITHUB_TOKEN 权限
permissions:
  contents: read

# 一次推送只保留最新一轮：旧提交的检查结果没人看，浪费额度
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: 后端（ruff + pytest）
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # 零基础设施：用例直接调用函数 / 服务 / 路由处理函数，协作者传替身；
    # Redis 用进程内 fakeredis，数据库、对象存储、沙箱都不连。
    # 因此这里**不启动任何 service**——起服务只会掩盖「用例偷偷连了真实依赖」。
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: 安装依赖
        # --locked：uv.lock 与 pyproject.toml 不一致时直接失败，而不是就地重解
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: 格式检查
        # ruff format 负责行长，因此 lint 里 E501 是开启的（没有 ignore）。
        # 这条检查保证「行长合规」不是靠人手维护。
        run: uv run ruff format --check .

      - name: 测试
        # 不需要真实模型网关、数据库、Redis 或对象存储：涉及上游的用例替换掉客户端或生成器，
        # Redis 用进程内 fakeredis，其余协作者传替身。
        run: uv run pytest

  quality:
    # 评测框架自己的测试必须**不依赖任何服务**：它要是需要 Postgres 才能跑，
    # 就没人会在改评测逻辑时跑它，而评测逻辑坏了会让后面所有结论失真。
    # 真实模型评测不在这里跑：一次全量要花钱且不稳定，属于发版前的人工动作。
    name: 评测框架自测（quality/）
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: 安装依赖
        run: uv sync --locked

      - name: 判分器 / 执行器 / 调优 / 安全 / 报告
        run: uv run pytest quality/tests -q

  frontend:
    name: 前端（lint + 类型 + 测试 + 构建）
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安装依赖
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: 类型检查
        run: npm run typecheck

      - name: 测试
        run: npm test

      - name: 构建
        # 构建脚本本身也会先跑 tsc --noEmit；这里保留独立步骤是为了让
        # 「类型错误」和「打包失败」在 CI 里显示为两个不同的失败项
        run: npm run build

  admin-frontend:
    name: 管理后台（lint + 类型 + 测试 + 构建）
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: admin-frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: admin-frontend/package-lock.json

      - name: 安装依赖
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: 类型检查
        run: npm run typecheck

      - name: 测试
        run: npm test

      - name: 构建
        run: npm run build
