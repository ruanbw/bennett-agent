name: CI

on:
  # 分支名必须与**实际默认分支**一致：这个仓库只有 `master`（`git ls-remote origin`
  # 只返回 refs/heads/master）。此前写的是 `main`，于是直接推到 master 的提交
  # 一次都不会触发任何检查——那套 1314 个后端用例 + 1138 个前端用例，从没在 CI 里
  # 跑过。改成两个分支都监听，以后改默认分支也不用再想这件事。
  push:
    branches: [master, main]
  pull_request:

# 只读权限：CI 不需要写仓库内容，显式收窄默认的 GITHUB_TOKEN 权限
permissions:
  contents: read

# 一次推送只保留最新一轮：旧提交的检查结果没人看，浪费额度
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: 后端（ruff + pytest）
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # 后端已经**不依赖本地文件**：数据库、限流/缓存、上传原件都是真实服务。
    # 因此 CI 必须把这三个服务跑起来——这正是「测试基座与生产同构」的代价与收益：
    # 建表脚本、外键、`FOR UPDATE SKIP LOCKED`、Lua 限流脚本都会在 CI 里真跑一次。
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: bennett_test
          POSTGRES_USER: bennett
          POSTGRES_PASSWORD: bennett
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bennett -d bennett_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      rustfs:
        image: rustfs/rustfs:latest
        env:
          RUSTFS_VOLUMES: /data
          RUSTFS_ADDRESS: 0.0.0.0:9000
          RUSTFS_CONSOLE_ENABLE: "false"
          RUSTFS_ACCESS_KEY: rustfsadmin
          RUSTFS_SECRET_KEY: rustfsadmin
        ports:
          - 9000:9000
        options: >-
          --health-cmd "curl -fsS http://127.0.0.1:9000/health || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
    env:
      # tests/conftest.py 会读这三项：库名/桶名都带 `_test`，与任何开发配置隔离
      TEST_DATABASE_URL: postgresql+asyncpg://bennett:bennett@127.0.0.1:5432/bennett_test
      REDIS_URL: redis://127.0.0.1:6379/15
      S3_ENDPOINT_URL: http://127.0.0.1:9000
      S3_ACCESS_KEY: rustfsadmin
      S3_SECRET_KEY: rustfsadmin
      S3_BUCKET: bennett-test-artifacts
      S3_PREFIX: test-artifacts
      S3_USE_PATH_STYLE: "true"
      # 建库脚本在应用启动时执行；测试由 conftest 自己跑一遍
      DATABASE_APPLY_SCHEMA: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: 安装依赖
        # --locked：uv.lock 与 pyproject.toml 不一致时直接失败，而不是就地重解
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: 格式检查
        # ruff format 负责行长，因此 lint 里 E501 是开启的（没有 ignore）。
        # 这条检查保证「行长合规」不是靠人手维护。
        run: uv run ruff format --check .

      - name: 测试
        # 不需要真实模型网关：涉及上游的用例都替换掉了客户端或生成器。
        # 但**需要** postgres / redis / rustfs（见上面的 services）。
        run: uv run pytest

  quality:
    # 评测框架自己的测试必须**不依赖任何服务**：它要是需要 Postgres 才能跑，
    # 就没人会在改评测逻辑时跑它，而评测逻辑坏了会让后面所有结论失真。
    # 真实模型评测不在这里跑：一次全量要花钱且不稳定，属于发版前的人工动作。
    name: 评测框架自测（quality/）
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: 安装依赖
        run: uv sync --locked

      - name: 判分器 / 执行器 / 调优 / 安全 / 报告
        run: uv run pytest quality/tests -q

  frontend:
    name: 前端（lint + 类型 + 测试 + 构建）
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安装依赖
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: 类型检查
        run: npm run typecheck

      - name: 测试
        run: npm test

      - name: 构建
        # 构建脚本本身也会先跑 tsc --noEmit；这里保留独立步骤是为了让
        # 「类型错误」和「打包失败」在 CI 里显示为两个不同的失败项
        run: npm run build

  admin-frontend:
    name: 管理后台（lint + 类型 + 测试 + 构建）
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: admin-frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: admin-frontend/package-lock.json

      - name: 安装依赖
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: 类型检查
        run: npm run typecheck

      - name: 测试
        run: npm test

      - name: 构建
        run: npm run build
