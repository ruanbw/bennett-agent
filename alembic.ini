# Alembic 配置。数据库连接串不写在这里：migrations/env.py 从 app.config.settings 读取
# （DATABASE_URL，同一处配置），避免连接串出现第二份真相。
# 用法（在仓库根目录）：uv run alembic upgrade head / alembic revision -m "..."

[alembic]
script_location = %(here)s/migrations
file_template = %%(rev)s_%%(slug)s
# 让 env.py 能 import app.*（等价于从仓库根运行）
prepend_sys_path = .
path_separator = os
version_path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
