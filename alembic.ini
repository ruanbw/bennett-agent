# Alembic 配置
#
# ## 连接串不写在这里
#
# `sqlalchemy.url` 刻意留空，由 `migrations/env.py` 从 `app.config.settings` 读取。
# 写两份的唯一后果是「迁移连的库和应用的库不是同一个」——它的表现是：迁移报告成功，
# 应用启动却仍说结构不是 head，而两边的配置看起来都对。
#
# ## 迁移在部署里是独立一步
#
#   docker compose run --rm migrate      # 容器内：alembic upgrade head
#   uv run alembic upgrade head          # 宿主机直跑（依赖 compose 里的 postgres）
#   uv run alembic revision --autogenerate -m "add xxx"
#   uv run alembic check                 # CI：确认模型与迁移没有漂移
#
# 应用启动**不会**自动 upgrade，只校验 revision 是否等于 head（见 app/db.py）。

[alembic]
script_location = migrations

# 让 `alembic` 在仓库根就能 `import app.*`，不用先 activated venv 再 cd
prepend_sys_path = .
# 新版本要求显式声明路径分隔符，否则按空格/逗号/冒号拆分（已废弃行为）
path_separator = os

# 版本文件名用「revision_说明」，避免不同人本地生成同名文件互相覆盖
file_template = %%(rev)s_%%(slug)s

# 迁移脚本里的时间戳统一用 UTC：多台机器/容器时区不同，本地时间会让迁移顺序难以对账
timezone = UTC

# 连接串留空（见文件头说明）
sqlalchemy.url =

# ---------------------------------------------------------------------
# 日志
# ---------------------------------------------------------------------
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
