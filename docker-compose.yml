# Bennett Agent 的 Compose 部署
#
# ## 这个文件编排什么
#
#   postgres  业务库（用户 / 会话 / 会话同步 / 模型提供商与模型 / 沙箱租约）
#   redis     限流计数、搜索缓存、会话 token 热缓存
#   rustfs    对象存储（S3 协议），存沙箱产物
#   app       FastAPI 后端（只提供 /api/*，启动时执行 sql/init.sql 建表，并跑沙箱回收）  [profile: app]
#
# ## 开发与生产的区别：靠 profile 表达
#
# 开发时**只跑依赖**，前后端由开发者自己用命令起（改一行代码立刻生效，不走镜像重建）：
#
#   docker compose up -d                 # 只起 postgres / redis / rustfs
#   uv run python main.py               # 后端 + 沙箱回收（一条命令）
#
#   cd frontend && npm run dev           # 前端
#
# 生产的全部服务由 `app` profile 打开：
#
#   docker compose --profile app up -d --build
#
# 为什么用 profile 而不是两份 compose 文件：服务拓扑、卷、`depends_on`、健康检查
# 只有一份真相。两份文件一定会漂移——最后「本地能起、生产起不来」的差异就出在
# 某个只在一边改过的字段上。
#
# 前端仍是独立的静态产物，不在这里（见 Dockerfile 顶部关于前后端分离的说明）。
#
# ## 建表在应用启动时做
#
# `sql/init.sql` 整段幂等、在单个事务里执行，多实例同时启动也安全：并发 DDL 由
# Postgres 自己的锁串行化，`CREATE ... IF NOT EXISTS` 重复执行无副作用。
# 直接用改脚本 + 重建库的流程，不维护增量迁移（见 README「数据库结构」）。
#
# ## 用法
#
#   cp .env.example .env      # 至少填 AUTH_SECRET / LITELLM_API_BASE / LITELLM_API_KEY
#   docker compose --profile app up -d --build      # 生产：全部服务
#   docker compose up -d                            # 开发：只起依赖
#   docker compose logs -f app
#
# 数据库/Redis/对象存储的数据都在命名卷里，`docker compose down` 不会删（加 `-v` 才会）。
# 注意 `down -v` 会同时删掉对象存储里的沙箱产物与全部会话。
#
# ## 端口只绑回环
#
# 注册入口是开放的，Postgres/Redis **没有任何 TLS 与鉴权之外的防护**（Redis 默认连密码
# 都没有）。绑到 0.0.0.0 等于把库和缓存开放给同网段：Redis 被连上就能读写限流计数、
# 会话缓存，Postgres 被连上就是全量数据。要远程访问请走 SSH 隧道或带 TLS 的反代，
# 不要把 `127.0.0.1:` 前缀去掉。

name: bennett-agent

services:
  postgres:
    image: postgres:17-alpine
    container_name: bennett-postgres
    restart: unless-stopped
    # 只发布到回环：容器之间走服务名，宿主只用于本地调试（psql / Datagrip）
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bennett}
      POSTGRES_USER: ${POSTGRES_USER:-bennett}
      # 没有回退默认值（`:-bennett`）了：那份口令是公开的、写在仓库里，而 compose 网络内
      # 任何被攻陷的容器都能拿它直接连库。缺失时让 compose 直接报错，比静默用一个已知口令好。
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?必须在 .env 里显式设置 POSTGRES_PASSWORD（见 .env.example）}
      # 初始化时就用 scram-sha-256，而不是默认的 trust/peer：
      # 不然容器网络内任何进程都能无密码连库。
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    command:
      # max_connections 必须 >= (POOL_SIZE + MAX_OVERFLOW) × worker 数，再加上
      # worker/psql 的零头。默认 100 在 4 worker 下正好打满，是
      # 「本地没事、一上生产就 QueuePool Timeout」的常见成因。
      - postgres
      - -c
      - max_connections=200
      - -c
      - shared_buffers=256MB
      # 慢查询日志：超过 1s 的语句记下来。它比事后猜「为什么慢」便宜得多。
      - -c
      - log_min_duration_statement=1000
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # pg_isready 只证明「接受连接」，不证明库已经初始化完成——但
      # `service_healthy` 要的就是这个程度：建表脚本会在应用启动时再跑一遍。
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bennett} -d ${POSTGRES_DB:-bennett}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    container_name: bennett-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    # AOF 而不是纯 RDB：Redis 里存的是限流计数与会话热缓存，重启丢几秒数据可以接受，
    # 但丢到上一个快照点意味着**限流窗口整体重置**（一次可被放大的窗口）。
    # everysec 是持久性与吞吐的常规折中点。
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      # 内存上限 + noeviction：这是有状态存储（计数/会话），不能用 LRU 悄悄淘汰。
      # 触顶时写入报错（应用侧会降级并告警），而不是让限流计数无声消失。
      - --maxmemory
      - 512mb
      - --maxmemory-policy
      - noeviction
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  rustfs:
    # RustFS：Rust 写的 S3 兼容对象存储（MinIO 的开源替代）。
    # 客户端用标准 boto3（S3 协议），换回 AWS S3 / OSS 只需改 S3_ENDPOINT_URL。
    image: rustfs/rustfs:latest
    container_name: bennett-rustfs
    restart: unless-stopped
    security_opt:
      - "no-new-privileges:true"
    ports:
      - "127.0.0.1:9000:9000" # S3 API
      - "127.0.0.1:9001:9001" # 控制台（建桶 / 看对象）
    environment:
      # 单节点单盘：零纠删码，没有额外冗余。适合本地/小规模；
      # 要冗余就挂多个卷（RUSTFS_VOLUMES=/data/rustfs{0..3}）并接受相应的磁盘占用。
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: "0.0.0.0:9000"
      RUSTFS_CONSOLE_ADDRESS: "0.0.0.0:9001"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_REGION: ${S3_REGION:-us-east-1}
      # **默认值是公开的**（rustfsadmin/rustfsadmin）。这里从 .env 读，缺省也给了
      # 同一个公开值，但只在回环端口上暴露。对外提供前必须换成强随机值。
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:-rustfsadmin}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:-rustfsadmin}
      RUSTFS_OBS_LOGGER_LEVEL: info
    volumes:
      # 容器以非 root 用户 10001:10001 运行；用命名卷避免宿主目录权限问题
      - rustfs-data:/data
      - rustfs-logs:/app/logs
    healthcheck:
      # 官方健康端点（S3 口）；不要用根路径判断——它可能返回 200 的空页面。
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"


  app:
    profiles: ["app"]
    build:
      context: .
      dockerfile: Dockerfile
    image: bennett-agent:local
    container_name: bennett-agent
    restart: unless-stopped
    # 最小权限：丢掉全部 Linux capabilities（应用只需监听 8000 与向外建连，都用不到特权），
    # 并禁止通过 setuid/setgid 二进制提权（no-new-privileges）。被 RCE 后攻击者拿到的
    # 只是一个普通用户加零特权——横向移动与内核面利用的成本高很多。
    # 没有加 `read_only`：运行期确实不写应用目录（镜像里有 PYTHONDONTWRITEBYTECODE=1），
    # 但第三方库/子进程是否写 `~/.cache` 无法在本次验收中实测，而漏挂 tmpfs 的症状是
    # 「启动正常、某个功能静默失败」，比不加更难查。
    cap_drop:
      - ALL
    security_opt:
      - "no-new-privileges:true"
    ports:
      # 默认只绑回环：注册入口是开放的，绑到 0.0.0.0 等于把注册与上游模型额度
      # 开放给同网段。要对外提供就在前面放一个带 TLS 的反向代理。
      - "127.0.0.1:8000:8000"
    env_file:
      # 环境变量从 .env 加载（注意：env_file 只是把文件里的键值设成容器环境变量）。
      # 这与逐条写在 `environment:` 里没有区别——两者都会出现在 `docker inspect`、
      # `docker exec env`、崩溃转储里，也都会被容器内任意子进程继承。
      # 真正不能进环境的只有密钥：那部分请用 secret 文件挂载（把 SETTINGS_SECRETS_DIR
      # 指向挂载目录，见 .env.example），不要写进 .env。
      - .env
    environment:
      # 服务地址与宿主机直跑不同，只能在这里覆盖。
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-bennett}:${POSTGRES_PASSWORD:?必须在 .env 里显式设置 POSTGRES_PASSWORD（见 .env.example）}@postgres:5432/${POSTGRES_DB:-bennett}
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT_URL: http://rustfs:9000
      # 容器之间的调用必须绕过宿主代理。
      #
      # Docker Desktop（以及部分 CI 运行器）会把宿主的 HTTP(S)_PROXY 注入每个容器。
      # 若 `no_proxy` 里没有内部服务名，`http://rustfs:9000` 会被送到宿主代理，
      # 而代理当然不知道 `rustfs` 是什么——它返回 502，而应用侧的报错是
      # 「确保桶存在失败（code=502）」，与「对象存储没起来」看起来一模一样。
      # TCP 服务的 postgres/redis 不受影响（代理只管 HTTP），列在这里是为了明确语义。
      NO_PROXY: "localhost,127.0.0.1,host.docker.internal,postgres,redis,rustfs${NO_PROXY:+,$NO_PROXY}"
      no_proxy: "localhost,127.0.0.1,host.docker.internal,postgres,redis,rustfs${no_proxy:+,$no_proxy}"
      # 容器内必须监听 0.0.0.0，否则宿主映射的端口进不来
      # 生产容器**强制** production：这里不能用 `${APP_ENV:-production}`。
      # `.env.example` 里 APP_ENV=development，而 README 的生产部署步骤正是
      # `cp .env.example .env && docker compose --profile app up`——compose 会用 .env
      # 做插值，`environment:` 又覆盖 `env_file:`，于是生产容器实际跑在 development，
      # 而所有生产守卫（拒绝占位 AUTH_SECRET、强制 Secure cookie、关闭 /docs、
      # 收紧 CORS）全部挂在 `app_env == "production"` 上，一条都没生效。
      # 要跑非生产环境请显式覆盖这个变量，而不是靠 .env 的默认值。
      APP_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rustfs:
        condition: service_healthy
    healthcheck:
      # 与 Dockerfile 里一致：用 readiness（真的 ping 数据库）。
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=4).status == 200 else 1)"
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    # 单轮 SSE 预算 600s，但优雅关闭最多等 5s（见 main.py 的 uvicorn 参数）；
    # 之后 `_run_all` 还会等回收循环把手上这一台收尾（最多 10s）。
    # 给 25s 覆盖这两段，又不会让 docker stop 等到超时。
    stop_grace_period: 25s
    logging:
      # 默认的 json-file 驱动**没有任何大小上限**，长期运行会把宿主磁盘写满。
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres-data:
    name: bennett-postgres-data
  redis-data:
    name: bennett-redis-data
  # 显式命名，避免 `docker compose down -v` 之外的重建把它丢掉
  rustfs-data:
    name: bennett-rustfs-data
  rustfs-logs:
    name: bennett-rustfs-logs
