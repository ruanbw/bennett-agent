[project]
name = "bennett-agent"
version = "0.1.0"
description = "基于 PydanticAI + LiteLLM 的 Agent 框架，含 FastAPI SSE 后端与 React 19 前端"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "aiosqlite>=0.22.1",
    "cryptography>=42.0",
    "fastapi>=0.142.2",
    "fastapi-users[sqlalchemy]>=15.0.0",
    "httpx>=0.28.1",
    "jinja2>=3.1.5",
    "litellm>=1.104.0",
    "pydantic-ai>=2.31.1",
    "pydantic-settings>=2.7.0",
    "python-dotenv>=1.2.4",
    "sse-starlette>=3.5.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pyyaml>=6.0",
    "ruff>=0.9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# 让测试能 import app.*：tests/ 下没有 __init__.py，pytest 默认只把 tests/ 自己
# 放进 sys.path，仓库根需要显式声明。
pythonpath = ["."]
addopts = "-q"
# 异步用例直接写 async def，不用逐个包 asyncio.run
asyncio_mode = "auto"

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
