[project]
name = "bennett-agent"
version = "0.1.0"
description = "基于 PydanticAI + LiteLLM 的 Agent 框架，含 FastAPI SSE 后端与 React 19 前端"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # 数据库：异步驱动。SQLite 已从支持矩阵里移除，见 app/db.py
    "asyncpg>=0.30",
    # 共享状态：限流计数、业务缓存、会话热缓存
    "redis>=5.2",
    # 对象存储（S3 / RustFS 同一套 API）。同步客户端放到线程池里用，见 app/services/storage/s3.py
    "boto3>=1.35",
    "cryptography>=42.0",
    "fastapi>=0.142.2",
    "fastapi-users[sqlalchemy]>=15.0.0",
    "httpx>=0.28.1",
    "jinja2>=3.1.5",
    "litellm>=1.104.0",
    "pydantic-ai>=2.31.1",
    "pydantic-settings>=2.7.0",
    "python-dotenv>=1.2.4",
    "sse-starlette>=3.5.0",
    "uvicorn[standard]>=0.54.0",
    "opensandbox>=1.1.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pyyaml>=6.0",
    "ruff>=0.9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# 让测试能 import app.*：tests/ 下没有 __init__.py，pytest 默认只把 tests/ 自己
# 放进 sys.path，仓库根需要显式声明。
pythonpath = ["."]
addopts = "-q"
# 异步用例直接写 async def，不用逐个包 asyncio.run
asyncio_mode = "auto"
# **整个测试会话共用一个事件循环**。
# app/db.py 的 engine 是模块级单例，连接池里的 asyncpg 连接绑定在创建它的事件循环上。
# 默认的「每个测试一个循环」会让第二个用例拿到上一个循环的连接，报
# `Future attached to a different loop`——而那个报错发生在任何断言之泚，看起来像
# 「测试框架坏了」。共用会话级循环是最小、也最接近生产的做法（生产只有一个循环）。
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
